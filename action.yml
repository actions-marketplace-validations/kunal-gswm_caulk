name: 'Caulk Security Scanner'
description: 'Deterministic, open-source security checker for modern application repositories.'
author: 'Caulk Contributors'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Path to repository or project directory to scan'
    required: false
    default: '.'
  severity-threshold:
    description: 'Minimum severity to fail the workflow (CRITICAL, HIGH, MEDIUM, LOW, INFO)'
    required: false
    default: 'HIGH'
  check-vulns:
    description: 'Enable outbound network query to OSV database for dependency vulnerabilities'
    required: false
    default: 'false'
  python-version:
    description: 'Supported Python version to use for running Caulk'
    required: false
    default: '3.12'

outputs:
  scan-result:
    description: 'Scan result outcome (passed, failed, or error)'
    value: ${{ steps.run-caulk.outputs.scan-result }}
  findings-count:
    description: 'Total number of detected findings'
    value: ${{ steps.run-caulk.outputs.findings-count }}
  report-path:
    description: 'Path to generated JSON report file'
    value: ${{ steps.run-caulk.outputs.report-path }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python runtime
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Caulk
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --no-cache-dir "${ACTION_PATH}"

    - name: Run Caulk Scan
      id: run-caulk
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_SEVERITY_THRESHOLD: ${{ inputs.severity-threshold }}
        INPUT_CHECK_VULNS: ${{ inputs.check-vulns }}
        INPUT_PYTHON_VERSION: ${{ inputs.python-version }}
        ACTION_PATH: ${{ github.action_path }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
        GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
        GITHUB_OUTPUT: ${{ env.GITHUB_OUTPUT }}
        RUNNER_TEMP: ${{ runner.temp }}
      run: |
        python -m caulk.action

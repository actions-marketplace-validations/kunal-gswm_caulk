name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & Types (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type check with Mypy
        run: |
          mypy src

      - name: Run Test Suite
        run: |
          pytest --cov=caulk --cov-report=term-missing --cov-report=xml

  action-test:
    name: Action Integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Caulk Action on Clean Fixture
        id: caulk-clean
        uses: ./
        with:
          path: tests/fixtures/clean
          severity-threshold: HIGH
          check-vulns: false

      - name: Verify Clean Action Outputs
        shell: bash
        run: |
          test "${{ steps.caulk-clean.outputs.scan-result }}" = "passed"
          test "${{ steps.caulk-clean.outputs.findings-count }}" = "0"
          test -f "${{ steps.caulk-clean.outputs.report-path }}"

      - name: Run Caulk Action on Vulnerable Fixture (Expect Breach)
        id: caulk-vuln
        uses: ./
        continue-on-error: true
        with:
          path: tests/fixtures/vulnerable
          severity-threshold: HIGH
          check-vulns: false

      - name: Verify Vulnerable Action Outcome & Outputs
        shell: bash
        run: |
          test "${{ steps.caulk-vuln.outcome }}" = "failure"
          test "${{ steps.caulk-vuln.outputs.scan-result }}" = "failed"
          test "${{ steps.caulk-vuln.outputs.findings-count }}" != "0"
          test -f "${{ steps.caulk-vuln.outputs.report-path }}"

      - name: Run Caulk Action with CRITICAL threshold
        id: caulk-override
        uses: ./
        with:
          path: tests/fixtures/clean
          severity-threshold: CRITICAL

      - name: Verify Threshold Action Outputs
        shell: bash
        run: |
          test "${{ steps.caulk-override.outputs.scan-result }}" = "passed"

      - name: Verify Step Summary Safety & Content
        shell: bash
        run: |
          echo "=== STEP SUMMARY CONTENT ==="
          cat "$GITHUB_STEP_SUMMARY"
          echo "=== END STEP SUMMARY ==="
          test -s "$GITHUB_STEP_SUMMARY"
          grep "Caulk Security Scan Report" "$GITHUB_STEP_SUMMARY"
          grep "Scan Result: ❌ Failed" "$GITHUB_STEP_SUMMARY"
          grep "Scan Result: ✅ Passed" "$GITHUB_STEP_SUMMARY"
          if grep "N3v3rGu3ssMeP@ss" "$GITHUB_STEP_SUMMARY"; then
            echo "Error: Found unredacted password in step summary!"
            exit 1
          fi
          if grep "caulk_test_secret_token_9481948104810481" "$GITHUB_STEP_SUMMARY"; then
            echo "Error: Found unredacted secret token in step summary!"
            exit 1
          fi

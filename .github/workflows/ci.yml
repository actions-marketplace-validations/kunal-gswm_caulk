name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & Types (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type check with Mypy
        run: |
          mypy src

      - name: Run Test Suite
        run: |
          pytest --cov=caulk --cov-report=term-missing --cov-report=xml

  action-test:
    name: Action Integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Caulk Action on Clean Fixture
        id: caulk-clean
        uses: ./
        with:
          path: tests/fixtures/clean
          severity-threshold: HIGH
          check-vulns: false

      - name: Verify Clean Action Outputs
        shell: bash
        run: |
          test "${{ steps.caulk-clean.outputs.scan-result }}" = "passed"
          test "${{ steps.caulk-clean.outputs.findings-count }}" = "0"
          test -f "${{ steps.caulk-clean.outputs.report-path }}"

      - name: Run Caulk Action on Vulnerable Fixture (Expect Breach)
        id: caulk-vuln
        uses: ./
        continue-on-error: true
        with:
          path: tests/fixtures/vulnerable
          severity-threshold: HIGH
          check-vulns: false

      - name: Verify Vulnerable Action Outcome & Outputs
        shell: bash
        run: |
          test "${{ steps.caulk-vuln.outcome }}" = "failure"
          test "${{ steps.caulk-vuln.outputs.scan-result }}" = "failed"
          test "${{ steps.caulk-vuln.outputs.findings-count }}" != "0"
          test -f "${{ steps.caulk-vuln.outputs.report-path }}"

      - name: Run Caulk Action with CRITICAL threshold
        id: caulk-override
        uses: ./
        with:
          path: tests/fixtures/clean
          severity-threshold: CRITICAL

      - name: Verify Threshold Action Outputs
        shell: bash
        run: |
          test "${{ steps.caulk-override.outputs.scan-result }}" = "passed"

      - name: Run Caulk Action with Unsupported Python (Expect Early Rejection)
        id: caulk-bad-python
        uses: ./
        continue-on-error: true
        with:
          path: tests/fixtures/clean
          python-version: "3.9"

      - name: Verify Unsupported Python Early Rejection
        shell: bash
        run: |
          test "${{ steps.caulk-bad-python.outcome }}" = "failure"

      - name: Setup Clean Fixture Repository
        shell: bash
        run: |
          python -c "import subprocess, pathlib; r = pathlib.Path('clean-repo'); r.mkdir(parents=True, exist_ok=True); subprocess.run(['git', 'init', '-b', 'main', str(r)], check=True); subprocess.run(['git', '-C', str(r), 'config', 'user.name', 'Tester'], check=True); subprocess.run(['git', '-C', str(r), 'config', 'user.email', 'test@example.com'], check=True); (r / 'clean.py').write_text('print(1)\n'); subprocess.run(['git', '-C', str(r), 'add', 'clean.py'], check=True); subprocess.run(['git', '-C', str(r), 'commit', '-m', 'c1'], check=True); s = pathlib.Path('shallow-clean-repo'); subprocess.run(['git', 'clone', '--depth', '1', r.resolve().as_uri(), str(s)], check=True)"

      - name: Test Shallow Clean History Scan Fails Closed (Incomplete)
        id: caulk-shallow-clean
        uses: ./
        continue-on-error: true
        with:
          path: shallow-clean-repo
          severity-threshold: HIGH
          scan-history: true

      - name: Verify Shallow Clean History Rejection
        shell: bash
        run: |
          test "${{ steps.caulk-shallow-clean.outcome }}" = "failure"
          test "${{ steps.caulk-shallow-clean.outputs.scan-result }}" = "error"

      - name: Run Caulk Action on Full History Clean Repository
        id: caulk-full-clean
        uses: ./
        with:
          path: clean-repo
          severity-threshold: HIGH
          scan-history: true

      - name: Verify Full Clean History Passes
        shell: bash
        run: |
          test "${{ steps.caulk-full-clean.outputs.scan-result }}" = "passed"
          test "${{ steps.caulk-full-clean.outputs.findings-count }}" = "0"
          test -f "${{ steps.caulk-full-clean.outputs.report-path }}"

      - name: Run Caulk Action with History Scanning on Repository
        id: caulk-history
        uses: ./
        continue-on-error: true
        with:
          path: .
          severity-threshold: HIGH
          scan-history: true

      - name: Verify History Action Outcome & Outputs
        shell: bash
        run: |
          test "${{ steps.caulk-history.outcome }}" = "failure"
          test -f "${{ steps.caulk-history.outputs.report-path }}"
          test "${{ steps.caulk-history.outputs.findings-count }}" != "0"

      - name: Verify Job Summary Generation and Secret Safety
        shell: bash
        env:
          REPORT_PATH: ${{ steps.caulk-vuln.outputs.report-path }}
        run: |
          python -c "import json, os; from pathlib import Path; from caulk.models import Severity; from caulk.reporting.summary import generate_step_summary; report = json.loads(Path(os.environ['REPORT_PATH']).read_text(encoding='utf-8')); summary = generate_step_summary(report, threshold=Severity.HIGH); assert 'Caulk Security Scan Report' in summary; assert 'Scan Result: ❌ Failed' in summary; assert 'N3v3rGu3ssMeP@ss' not in summary; assert 'caulk_test_secret_token_9481948104810481' not in summary; print('Step summary verified cleanly without leaking secrets.')"

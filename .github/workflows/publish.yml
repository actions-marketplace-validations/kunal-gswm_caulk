name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git release tag to publish (e.g. v0.3.0)'
        required: true
        default: 'v0.3.0'

permissions: {}

jobs:
  build:
    name: Build Release Distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate release tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag '${TAG}'. Must match v<major>.<minor>.<patch>." >&2
            exit 1
          fi
          echo "RESOLVED_TAG=${TAG}" >> "${GITHUB_ENV}"
          echo "EXPECTED_VERSION=${TAG#v}" >> "${GITHUB_ENV}"

      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RESOLVED_TAG }}
          persist-credentials: false

      - name: Verify commit and version alignment
        shell: bash
        run: |
          COMMIT_SHA="$(git rev-parse HEAD)"
          echo "Checked out commit SHA: ${COMMIT_SHA} for tag ${RESOLVED_TAG}"
          
          # Exact commit guard for v0.3.0
          if [ "${RESOLVED_TAG}" = "v0.3.0" ]; then
            EXPECTED_COMMIT="02f43d206c5f016a589be388148363981b9e2235"
            if [ "${COMMIT_SHA}" != "${EXPECTED_COMMIT}" ]; then
              echo "::error::Tag v0.3.0 resolves to commit ${COMMIT_SHA}, expected ${EXPECTED_COMMIT}." >&2
              exit 1
            fi
          fi

      - name: Set up Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build tool
        run: |
          python -m pip install --upgrade pip build

      - name: Build distributions
        run: |
          python -m build

      - name: Validate built package artifacts
        shell: bash
        run: |
          ls -la dist/
          WHEEL="$(ls dist/caulk_security-${EXPECTED_VERSION}-py3-none-any.whl 2>/dev/null || true)"
          SDIST="$(ls dist/caulk_security-${EXPECTED_VERSION}.tar.gz 2>/dev/null || true)"
          
          if [ -z "${WHEEL}" ] || [ -z "${SDIST}" ]; then
            echo "::error::Expected distribution files for caulk-security version ${EXPECTED_VERSION} not found." >&2
            exit 1
          fi
          
          python -c "
          import zipfile
          z = zipfile.ZipFile('${WHEEL}')
          meta = z.read('caulk_security-${EXPECTED_VERSION}.dist-info/METADATA').decode('utf-8')
          assert 'Name: caulk-security' in meta, 'Missing package Name: caulk-security'
          assert 'Version: ${EXPECTED_VERSION}' in meta, 'Missing package Version: ${EXPECTED_VERSION}'
          print('Wheel metadata successfully validated for caulk-security ${EXPECTED_VERSION}')
          "

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 1

  publish-to-pypi:
    name: Publish to PyPI via Trusted Publishing
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/caulk-security
    permissions:
      id-token: write # Mandatory for PyPI Trusted Publishing (OIDC)

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          verify-metadata: true
          verbose: true
